<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>КРИСТАЛБАНК — Авторизація</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --accent: #38bdf8;
            --bg-dark: #020617;
            --card-bg: rgba(15,23,42,.88);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            height: 100vh;
            background: var(--bg-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Фон з партиклами */
        .deep-space-bg {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, #0c3a5e 0%, #020617 70%);
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent);
            animation: float 15s infinite;
        }

        @keyframes float {
            0% { transform: translateY(100vh) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100px) translateX(100px); opacity: 0; }
        }

        .ambient-glow {
            position: absolute;
            width: 60vw;
            height: 60vh;
            background: radial-gradient(circle, rgba(56,189,248,0.14), transparent 70%);
            filter: blur(100px);
            animation: pulse 6s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: .6; }
            50% { opacity: 1; }
        }

        /* Форма */
        .card {
            position: relative;
            background: linear-gradient(160deg, rgba(56,189,248,.7), rgba(2,6,23,.95));
            padding: 1.5px;
            border-radius: 28px;
            box-shadow: 0 0 55px rgba(56,189,248,.35);
            z-index: 2;
        }

        .card2 {
            background: var(--card-bg);
            border-radius: 26px;
            transition: .25s ease;
        }

        .card2:hover {
            transform: scale(0.985);
        }

        .form {
            width: 400px;
            padding: 2.6em 2.6em 2.8em;
            display: flex;
            flex-direction: column;
            gap: 22px;
            border-radius: 26px;
        }

        #heading {
            text-align: center;
            margin-bottom: 4px;
        }

        .bank-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.9rem;
            letter-spacing: 3.5px;
            color: var(--accent);
        }

        .bank-sub {
            margin-top: 8px;
            font-size: .7rem;
            letter-spacing: 1.4px;
            color: #94a3b8;
        }

        .field {
            display: flex;
            align-items: center;
            gap: .9em;
            padding: .95em 1.1em;
            border-radius: 18px;
            background: rgba(2,6,23,.95);
            box-shadow: inset 3px 5px 10px rgba(0,0,0,.85);
            border: 1px solid rgba(56,189,248,.18);
            transition: .25s ease;
        }

        .field:focus-within {
            border-color: var(--accent);
            box-shadow: inset 3px 5px 10px rgba(0,0,0,.85), 0 0 26px rgba(56,189,248,.45);
        }

        .input-icon {
            width: 1.5em;
            height: 1.5em;
            fill: var(--accent);
            opacity: .9;
        }

        .input-field {
            background: none;
            border: none;
            outline: none;
            width: 100%;
            color: #e5e7eb;
            font-size: .95rem;
            letter-spacing: .5px;
        }

        .error-msg {
            color: #ef4444;
            font-size: 0.75rem;
            text-align: center;
            background: rgba(239, 68, 68, 0.1);
            padding: 8px;
            border-radius: 10px;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .submit-btn {
            margin-top: 10px;
            height: 50px;
            border-radius: 18px;
            border: none;
            cursor: pointer;
            font-size: .85rem;
            letter-spacing: 2px;
            font-weight: 600;
            color: #020617;
            background: linear-gradient(135deg, rgba(56,189,248,1), rgba(14,165,233,1));
            box-shadow: 0 0 35px rgba(56,189,248,.45), inset 0 0 0 1px rgba(255,255,255,.25);
            transition: .25s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 50px rgba(56,189,248,.6);
        }
    </style>
</head>
<body>
    <div class="deep-space-bg"></div>
    <div class="ambient-glow"></div>

    <!-- Партикли -->
    <div id="particles"></div>

    <div class="card">
        <div class="card2">
            <form class="form" method="POST" action="/login">
                <div id="heading">
                    <div class="bank-name">КРИСТАЛБАНК</div>
                    <div class="bank-sub">АВТОМАТИЗОВАНА СИСТЕМА УПРАВЛІННЯ</div>
                </div>

                <div class="field">
                    <svg viewBox="0 0 16 16" class="input-icon">
                        <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
                        <path d="M14 14s-1-4-6-4-6 4-6 4"/>
                    </svg>
                    <input 
                        type="text" 
                        name="username" 
                        class="input-field" 
                        placeholder="Логін" 
                        required 
                        minlength="3"
                        autocomplete="off" 
                    />
                </div>

                <div class="field">
                    <svg viewBox="0 0 16 16" class="input-icon">
                        <path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2z"/>
                        <path d="M3 7h10v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    </svg>
                    <input 
                        type="password" 
                        name="password" 
                        class="input-field" 
                        placeholder="Пароль" 
                        required 
                    />
                </div>

                {% with messages = get_flashed_messages() %}
                  {% if messages %}
                    <div class="error-msg">{{ messages[0] }}</div>
                  {% endif %}
                {% endwith %}

                <button class="submit-btn" type="submit">УВІЙТИ</button>
            </form>
        </div>
    </div>

    <script>
        // Створення партиклів
        const container = document.getElementById('particles');
        for(let i = 0; i < 50; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDelay = Math.random() * 15 + 's';
            p.style.animationDuration = (Math.random() * 10 + 10) + 's';
            container.appendChild(p);
        }
    </script>
</body>
</html>
