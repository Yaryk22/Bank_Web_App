<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Помилка сервера | КРИСТАЛБАНК</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at center, #450a0a 0%, #020617 80%);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .warning-lines {
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 10px,
                rgba(239, 68, 68, 0.03) 10px,
                rgba(239, 68, 68, 0.03) 20px
            );
            animation: scroll 20s linear infinite;
        }

        @keyframes scroll {
            0% { transform: translate(0, 0); }
            100% { transform: translate(20px, 20px); }
        }

        .container {
            text-align: center;
            z-index: 10;
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        .error-code {
            font-size: 12rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 100px rgba(239, 68, 68, 0.5);
            animation: pulse 2s ease-in-out infinite;
            line-height: 1;
            margin-bottom: 20px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(0.98); }
        }

        .error-icon {
            font-size: 4rem;
            color: #ef4444;
            margin-bottom: 20px;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 49%, 100% { opacity: 1; }
            50%, 99% { opacity: 0.3; }
        }

        .error-title {
            font-size: 2rem;
            margin-bottom: 15px;
            color: #ef4444;
            letter-spacing: 3px;
        }

        .error-message {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 40px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.6;
        }

        .btn-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 18px 40px;
            border: 2px solid;
            text-decoration: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 2px;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            overflow: hidden;
        }

        .btn-home {
            border-color: #ef4444;
            color: #ef4444;
        }

        .btn-home::before {
            content: '';
            position: absolute;
            inset: 0;
            background: #ef4444;
            transform: translateY(100%);
            transition: transform 0.4s;
            z-index: -1;
        }

        .btn-home:hover::before {
            transform: translateY(0);
        }

        .btn-home:hover {
            color: #fff;
            box-shadow: 0 0 40px rgba(239, 68, 68, 0.6);
            transform: translateY(-3px);
        }

        .btn-reload {
            border-color: #38bdf8;
            color: #38bdf8;
        }

        .btn-reload::before {
            content: '';
            position: absolute;
            inset: 0;
            background: #38bdf8;
            transform: translateY(100%);
            transition: transform 0.4s;
            z-index: -1;
        }

        .btn-reload:hover::before {
            transform: translateY(0);
        }

        .btn-reload:hover {
            color: #020617;
            box-shadow: 0 0 40px rgba(56, 189, 248, 0.6);
            transform: translateY(-3px);
        }

        @media (max-width: 768px) {
            .error-code {
                font-size: 8rem;
            }

            .error-title {
                font-size: 1.5rem;
            }

            .error-message {
                font-size: 0.9rem;
                padding: 0 20px;
            }

            .btn-container {
                flex-direction: column;
                align-items: center;
            }

            .btn {
                width: 80%;
            }
        }
    </style>
</head>
<body>
    <div class="warning-lines"></div>
    <div class="container">
        <div class="error-icon">⚠️</div>
        <div class="error-code">500</div>
        <h1 class="error-title">ВНУТРІШНЯ ПОМИЛКА СЕРВЕРА</h1>
        <p class="error-message">
            Вибачте, сталася непередбачена помилка. Наша команда вже працює над вирішенням проблеми. 
            Спробуйте оновити сторінку або повернутися пізніше.
        </p>
        <div class="btn-container">
            <a href="javascript:location.reload()" class="btn btn-reload">ОНОВИТИ СТОРІНКУ</a>
            <a href="/clients" class="btn btn-home">ГОЛОВНА СТОРІНКА</a>
        </div>
    </div>
</body>
</html>
