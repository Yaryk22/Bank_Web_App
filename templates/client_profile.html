<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> <!-- Character encoding for proper text display --> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Responsive design --> 
    <title>Client Profile</title> 
    <style> 
        /* Styles for the client profile layout */ 
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 20px; 
        } 
        .profile { 
            border: 1px solid #ccc; /* Border around client profile */ 
            padding: 20px; 
            margin-top: 20px; 
        } 
    </style> 
</head> 
<body> 
    <h1>Client Profile</h1> 
    <div class="profile" data-client-id="12345"> <!-- Unique identifier for client --> 
        <h2>Name: John Doe</h2> 
        <p>Email: john.doe@example.com</p> 
        <p>Phone: +123456789</p> 
    </div> 
    <script> 
        function showAlert() { 
            alert('Client Profile Loaded'); // Alert when client profile is loaded 
        } 
        showAlert(); // Call the function to show alert 
    </script> 
</body> 
</html>
